<!DOCTYPE html>
<html lang="en" data-accent="blue">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="Justin Wade Blankenship — Senior Medical Coding Specialist, CCS and CPC-A. Interactive node portfolio."
  >
  <title>Justin Blankenship — Senior Medical Coding Specialist</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%232563eb'/%3E%3Ccircle cx='11' cy='16' r='3' fill='white'/%3E%3Ccircle cx='22' cy='16' r='3' fill='white' fill-opacity='.55'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#overview">
      <span class="brand-dot" aria-hidden="true"></span>
      <span class="brand-text">Justin Blankenship</span>
    </a>

    <div class="topbar-right">
      <div class="accents" role="radiogroup" aria-label="Accent color">
        <button
          type="button"
          class="accent-btn is-active"
          data-accent="blue"
          aria-label="Blue accent"
        ></button>
        <button
          type="button"
          class="accent-btn"
          data-accent="teal"
          aria-label="Teal accent"
        ></button>
        <button
          type="button"
          class="accent-btn"
          data-accent="violet"
          aria-label="Violet accent"
        ></button>
        <button
          type="button"
          class="accent-btn"
          data-accent="amber"
          aria-label="Amber accent"
        ></button>
        <button
          type="button"
          class="accent-btn"
          data-accent="rose"
          aria-label="Rose accent"
        ></button>
      </div>

      <button type="button" id="cover-btn" class="btn btn-primary">
        Cover letter
      </button>
      <a
        class="btn"
        href="assets/docs/justin-blankenship-resume.pdf"
        download
      >
        Resume
      </a>
    </div>
  </header>

  <main class="shell">
    <aside class="profile">
      <p class="eyebrow">Senior Medical Coding Specialist</p>
      <h1 class="profile-name">Justin Wade<br>Blankenship</h1>
      <p class="profile-tagline" id="profile-tagline"></p>

      <dl class="stats" id="stats"></dl>

      <ul class="profile-links" id="profile-links"></ul>
    </aside>

    <section class="stage" aria-label="Portfolio sections">
      <nav class="flow" id="flow" aria-label="Section flow">
        <svg class="flow-line" id="flow-line" aria-hidden="true"></svg>
        <div class="flow-nodes" id="flow-nodes"></div>
      </nav>

      <div class="panel" id="panel" aria-live="polite"></div>
    </section>
  </main>

  <section class="strip" aria-label="Certifications">
    <div class="strip-label">
      <p>Credentials</p>
      <span>Click to enlarge</span>
    </div>
    <div class="strip-mask">
      <div class="strip-track" id="strip-track"></div>
    </div>
  </section>

  <div
    id="cover-layer"
    class="modal"
    hidden
    role="dialog"
    aria-modal="true"
    aria-labelledby="cover-title"
  >
    <div class="modal-scrim" data-close-cover></div>
    <article class="sheet">
      <header class="sheet-bar">
        <p>Cover letter</p>
        <div class="sheet-actions">
          <a class="btn btn-sm" href="assets/docs/cover-letter.pdf" download>
            Download PDF
          </a>
          <button
            type="button"
            class="btn btn-sm"
            data-close-cover
          >
            Close
          </button>
        </div>
      </header>
      <div class="sheet-body" id="cover-body"></div>
    </article>
  </div>

  <div
    id="lightbox"
    class="modal"
    hidden
    role="dialog"
    aria-modal="true"
    aria-label="Certificate"
  >
    <div class="modal-scrim" data-close-light></div>
    <figure class="light-frame">
      <img id="light-img" alt="">
      <figcaption id="light-cap"></figcaption>
      <button
        type="button"
        class="btn btn-sm light-close"
        data-close-light
      >
        Close
      </button>
    </figure>
  </div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
